<svg viewBox="0 0 820 640" width="820" height="640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111" />
    </marker>
  </defs>

  <!-- User box -->
  <rect x="30" y="20" width="350" height="210" rx="4" fill="none" stroke="#111" stroke-width="1.5" />
  <text x="48" y="44" font-size="15" font-weight="600" fill="#111">User</text>

  <!-- Laptop -->
  <g transform="translate(90,80)">
    <rect x="0" y="0" width="46" height="30" rx="2" fill="none" stroke="#111" stroke-width="1.6" />
    <rect x="4" y="4" width="38" height="22" fill="none" stroke="#111" stroke-width="1.2" />
    <path d="M-6,34 L52,34 L46,30 L0,30 Z" fill="#111" />
    <text x="23" y="58" font-size="13" fill="#111" text-anchor="middle">Web browser</text>
  </g>

  <!-- Phone -->
  <g transform="translate(240,76)">
    <rect x="0" y="0" width="26" height="42" rx="4" fill="none" stroke="#111" stroke-width="1.6" />
    <line x1="8" y1="36" x2="18" y2="36" stroke="#111" stroke-width="1.6" />
    <text x="13" y="62" font-size="13" fill="#111" text-anchor="middle">Mobile app</text>
  </g>

  <!-- DNS -->
  <g>
    <circle cx="740" cy="95" r="40" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8" />
    <g transform="translate(740,85)" stroke="#1d4ed8" stroke-width="1.3" fill="none">
      <circle cx="0" cy="0" r="13" />
      <ellipse cx="0" cy="0" rx="6" ry="13" />
      <line x1="-13" y1="0" x2="13" y2="0" />
      <path d="M-11,-6 Q0,-2 11,-6" />
      <path d="M-11,6 Q0,2 11,6" />
    </g>
    <text x="740" y="116" font-size="13" font-weight="600" fill="#1d4ed8" text-anchor="middle">DNS</text>
  </g>

  <!-- www.mysite.com -> DNS -->
  <line x1="380" y1="65" x2="696" y2="80" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="530" y="60" font-size="13" fill="#111" text-anchor="middle">www.mysite.com</text>

  <!-- IP address <- DNS -->
  <line x1="696" y1="112" x2="380" y2="125" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="540" y="145" font-size="13" fill="#111" text-anchor="middle">IP address</text>

  <!-- vertical arrows down to web server -->
  <line x1="113" y1="232" x2="113" y2="430" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="70" y="330" font-size="13" fill="#111" text-anchor="middle">www.mysite.com</text>

  <line x1="253" y1="232" x2="253" y2="430" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="300" y="330" font-size="13" fill="#111" text-anchor="middle">api.mysite.com</text>

  <!-- Web server dashed box -->
  <rect x="60" y="430" width="280" height="160" rx="4" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4" />
  <g transform="translate(180,460)">
    <rect x="0" y="0" width="36" height="46" rx="3" fill="#22c55e" />
    <rect x="7" y="8" width="22" height="4" fill="white" />
    <rect x="7" y="17" width="22" height="4" fill="white" />
    <circle cx="10" cy="34" r="2" fill="white" />
    <circle cx="17" cy="34" r="2" fill="white" />
    <text x="18" y="64" font-size="14" font-weight="600" fill="#111" text-anchor="middle">Web server</text>
  </g>

  <!-- Database dashed box -->
  <rect x="480" y="430" width="280" height="160" rx="4" fill="none" stroke="#111" stroke-width="1.5" stroke-dasharray="6 4" />
  <g transform="translate(590,460)">
    <path d="M0,8 A28,8 0 0 1 56,8 V38 A28,8 0 0 1 0,38 Z" fill="#3b82f6" />
    <ellipse cx="28" cy="8" rx="28" ry="8" fill="#60a5fa" />
    <text x="28" y="28" font-size="15" font-weight="700" fill="white" text-anchor="middle">DB</text>
    <text x="28" y="64" font-size="14" font-weight="600" fill="#111" text-anchor="middle">Database</text>
  </g>

  <!-- read/write/update -->
  <line x1="340" y1="470" x2="480" y2="470" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="410" y="460" font-size="13" fill="#111" text-anchor="middle">read/write/update</text>

  <!-- return data -->
  <line x1="480" y1="540" x2="340" y2="540" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="410" y="530" font-size="13" fill="#111" text-anchor="middle">return data</text>
</svg>
